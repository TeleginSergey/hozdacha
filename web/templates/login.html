<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — ХозДача</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div data-header-slot></div>

    <main class="container">
        <div class="auth-page">
            <div class="auth-card">
                <h2>Вход</h2>
                <form id="loginForm">
                    <input name="username" type="text" placeholder="Логин или email" required autocomplete="username">
                    <input name="password" type="password" placeholder="Пароль" required autocomplete="current-password">
                    <button type="submit" class="btn btn-primary">Войти</button>
                </form>
                <div class="form-footer">
                    Нет аккаунта? <a href="/register">Зарегистрироваться</a>
                </div>
            </div>
        </div>
    </main>

    <div data-footer-slot></div>

    <script src="/static/js/app.js"></script>
    <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const btn = e.target.querySelector('button');
        btn.disabled = true; btn.textContent = 'Вход...';
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: fd.get('username'),
                    password: fd.get('password')
                })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Ошибка входа');
            localStorage.setItem('auth_token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user || { username: fd.get('username') }));
            App.toast('Вход выполнен', 'success');
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect') || '/';
            setTimeout(() => { window.location.href = redirect; }, 600);
        } catch (err) {
            App.toast(err.message, 'error');
        } finally {
            btn.disabled = false; btn.textContent = 'Войти';
        }
    });
    </script>
</body>
</html>
