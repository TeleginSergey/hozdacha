<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a7c59">
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="48x48" href="/static/images/favicon-48.png">
    <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
    <title>Вход — ХозДача</title>
    <link rel="stylesheet" href="/static/css/style.css?v=27">
</head>
<body class="auth-page">

<div class="auth-card">
    <a href="/" class="brand" style="justify-content:center;margin-bottom:var(--sp-3)">
        <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </span>
        <span>ХозДача</span>
    </a>
    <h1 class="auth-card__title">С возвращением</h1>
    <p class="auth-card__sub">Введите почту — отправим код для входа</p>

    <div class="steps">
        <div class="step-dot active" id="dot1">1</div>
        <div class="step-line" id="line"></div>
        <div class="step-dot" id="dot2">2</div>
    </div>

    <div id="msgError" class="msg msg-error"></div>
    <div id="msgSuccess" class="msg msg-success"></div>

    <div class="step-panel active" id="panel1">
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" autofocus>
        </div>
        <button class="btn btn--block" id="btnStep1">Получить код</button>
    </div>

    <div class="step-panel" id="panel2">
        <button class="back-link" id="btnBack">← Назад</button>
        <p style="text-align:center;color:var(--c-text-soft);font-size:var(--fs-sm);margin-bottom:var(--sp-4)">
            Отправили код из 6 цифр на <strong id="emailDisplay" style="color:var(--c-text)"></strong>
        </p>
        <div class="code-box" id="codeBox">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="0">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="1">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="2">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="3">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="4">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="5">
        </div>
        <button class="btn btn--block" id="btnStep2">Войти</button>
        <button class="btn btn--outline btn--block" id="btnResend" style="margin-top:var(--sp-2)">Отправить код ещё раз</button>
    </div>

    <div class="footer-link">
        Нет аккаунта? <a href="/register">Создайте</a>
    </div>
</div>

<script>
let pendingEmail = null;

function showMsg(type, text) {
    var el = document.getElementById(type === 'error' ? 'msgError' : 'msgSuccess');
    el.textContent = text; el.style.display = 'block';
}
function hideMsgs() {
    document.getElementById('msgError').style.display = 'none';
    document.getElementById('msgSuccess').style.display = 'none';
}

function goStep(n) {
    var p1 = document.getElementById('panel1'), p2 = document.getElementById('panel2');
    var d1 = document.getElementById('dot1'), d2 = document.getElementById('dot2');
    var line = document.getElementById('line');
    if (n === 1) {
        p1.classList.add('active'); p2.classList.remove('active');
        d1.className = 'step-dot active'; d2.className = 'step-dot';
        line.classList.remove('done');
    } else {
        p1.classList.remove('active'); p2.classList.add('active');
        d1.className = 'step-dot done'; d2.className = 'step-dot active';
        line.classList.add('done');
    }
}

document.getElementById('btnStep1').addEventListener('click', async function() {
    var btn = this;
    hideMsgs();
    var email = document.getElementById('email').value.trim().toLowerCase();
    if (!email) { showMsg('error', 'Введите почту'); return; }

    btn.disabled = true; btn.textContent = 'Отправка...';
    try {
        var r = await fetch('/api/auth/login', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: email})
        });
        var d = await r.json();
        if (r.ok) {
            pendingEmail = email;
            document.getElementById('emailDisplay').textContent = email;
            goStep(2);
            document.querySelectorAll('#codeBox input').forEach(function(inp) { inp.value = ''; });
            document.querySelector('#codeBox input').focus();
            showMsg('success', d.message || 'Код отправлен на почту!');
        } else {
            showMsg('error', d.error || 'Ошибка');
        }
    } catch(e) { showMsg('error', 'Нет связи. Попробуйте ещё раз.'); }
    finally { btn.disabled = false; btn.textContent = 'Получить код'; }
});

var codeInputs = document.querySelectorAll('#codeBox input');
codeInputs.forEach(function(inp, i) {
    inp.addEventListener('input', function() {
        if (this.value && i < 5) codeInputs[i+1].focus();
    });
    inp.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && !this.value && i > 0) codeInputs[i-1].focus();
    });
    inp.addEventListener('paste', function(e) {
        e.preventDefault();
        var paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
        paste.split('').forEach(function(ch, j) { if (codeInputs[j]) codeInputs[j].value = ch; });
        var next = Math.min(paste.length, 5);
        if (codeInputs[next]) codeInputs[next].focus();
    });
});

document.getElementById('btnStep2').addEventListener('click', async function() {
    var btn = this;
    hideMsgs();
    var code = '';
    codeInputs.forEach(function(inp) { code += inp.value; });
    if (code.length !== 6) { showMsg('error', 'Введите код из 6 цифр'); return; }

    btn.disabled = true; btn.textContent = 'Проверка...';
    try {
        var r = await fetch('/api/auth/verify-email', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: pendingEmail, code: code})
        });
        var d = await r.json();
        if (r.ok) {
            localStorage.setItem('auth_token', d.token);
            localStorage.setItem('user', JSON.stringify(d.user));
            showMsg('success', 'Вход выполнен! Сейчас переадресуем...');
            setTimeout(function() {
                var p = new URLSearchParams(window.location.search);
                var redir = p.get('redirect');
                if (redir === 'checkout') window.location.href = '/checkout';
                else if (redir === 'cart') window.location.href = '/cart';
                else window.location.href = '/profile';
            }, 800);
        } else {
            showMsg('error', d.error || 'Неверный код');
        }
    } catch(e) { showMsg('error', 'Нет связи'); }
    finally { btn.disabled = false; btn.textContent = 'Войти'; }
});

document.getElementById('btnResend').addEventListener('click', async function() {
    var btn = this;
    hideMsgs();
    btn.disabled = true; btn.textContent = 'Отправка...';
    try {
        var r = await fetch('/api/auth/send-verification', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: pendingEmail})
        });
        var d = await r.json();
        if (r.ok) { showMsg('success', 'Код отправлен ещё раз!'); }
        else { showMsg('error', d.error || 'Ошибка'); }
    } catch(e) { showMsg('error', 'Нет связи'); }
    finally { btn.disabled = false; btn.textContent = 'Отправить код ещё раз'; }
});

document.getElementById('btnBack').addEventListener('click', function() { goStep(1); hideMsgs(); });
</script>
</body>
</html>
