<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.product.Name}} — ХозДача</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div data-header-slot></div>

    <main class="container">
        <p style="margin:16px 0;font-size:0.9rem"><a href="/catalog">← Назад к каталогу</a></p>

        <div class="product-detail">
            <img class="product-detail-img" id="productImg"
                src="{{if .product.ImageURL}}{{.product.ImageURL}}{{end}}"
                alt="{{.product.Name}}">

            <div class="product-detail-info">
                <h1>{{.product.Name}}</h1>
                <div class="product-detail-price">{{.product.Price}} ₽</div>

                <div id="stockBlock"></div>

                {{if .product.Description}}
                <div class="product-detail-desc">{{.product.Description}}</div>
                {{end}}

                <div style="display:flex;gap:8px;align-items:center;margin-top:16px">
                    <div class="cart-item-qty" style="margin:0">
                        <button id="qtyDec">−</button>
                        <span id="qtyValue">1</span>
                        <button id="qtyInc">+</button>
                    </div>
                    <button class="btn btn-accent" id="addToCart" style="flex:1">В корзину</button>
                </div>
            </div>
        </div>
    </main>

    <div data-footer-slot></div>

    <script src="/static/js/app.js"></script>
    <script>
    (function () {
        const product = {
            id: {{.product.ID}},
            name: {{.product.Name | printf "%q"}},
            price: {{.product.Price}},
            stock: {{.product.Stock}},
            image: {{if .product.ImageURL}}{{.product.ImageURL | printf "%q"}}{{else}}""{{end}}
        };

        // Placeholder для битой картинки
        const img = document.getElementById('productImg');
        if (!img.getAttribute('src')) img.src = App.PLACEHOLDER_IMG;
        img.onerror = () => { img.src = App.PLACEHOLDER_IMG; };

        // Сток-блок
        const stockEl = document.getElementById('stockBlock');
        if (product.stock <= 0) {
            stockEl.innerHTML = '<span class="product-card-stock stock-out">Нет в наличии</span>';
            document.getElementById('addToCart').disabled = true;
        } else if (product.stock < 5) {
            stockEl.innerHTML = `<span class="product-card-stock stock-low">Осталось ${product.stock} шт.</span>`;
        } else {
            stockEl.innerHTML = '<span class="product-card-stock stock-ok">В наличии</span>';
        }

        let qty = 1;
        const qtyEl = document.getElementById('qtyValue');
        document.getElementById('qtyDec').onclick = () => { if (qty > 1) { qty--; qtyEl.textContent = qty; } };
        document.getElementById('qtyInc').onclick = () => { if (qty < product.stock) { qty++; qtyEl.textContent = qty; } };
        document.getElementById('addToCart').onclick = () => {
            App.Cart.add(product, qty);
        };
    })();
    </script>
</body>
</html>
