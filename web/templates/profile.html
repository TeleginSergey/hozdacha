<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — ХозДача</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div data-header-slot></div>

    <main class="container">
        <h1 style="margin:24px 0">Личный кабинет</h1>

        <div class="profile-grid">
            <aside class="profile-sidebar">
                <div class="profile-avatar-lg" id="profileAvatar">U</div>
                <div id="profileName" style="font-weight:600;font-size:1.05rem"></div>
                <div id="profileEmail" style="color:var(--gray-600);font-size:0.85rem;margin-top:4px"></div>
                <div id="profilePhone" style="color:var(--gray-600);font-size:0.85rem;margin-top:4px"></div>
                <button class="btn btn-outline btn-sm" style="margin-top:16px;width:100%" id="editProfileBtn">Редактировать</button>
            </aside>

            <div class="profile-main">
                <div class="profile-card">
                    <h2 style="margin-bottom:16px">📦 Мои заказы</h2>
                    <div id="ordersList">
                        <p style="color:var(--gray-500);text-align:center;padding:20px">Загрузка...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit profile modal -->
        <div class="modal-overlay" id="editModal">
            <div class="modal-box" style="position:relative">
                <button class="modal-close" id="editClose">×</button>
                <h2>Редактировать профиль</h2>
                <form id="editForm">
                    <input name="name" type="text" placeholder="Имя" required>
                    <input name="phone" type="tel" placeholder="Телефон" required>
                    <input name="email" type="email" placeholder="Email" required>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </form>
            </div>
        </div>
    </main>

    <div data-footer-slot></div>

    <script src="/static/js/app.js"></script>
    <script>
    (function () {
        const { Auth, toast, formatPrice, escapeHtml } = App;

        if (!Auth.isLoggedIn()) {
            window.location.href = '/login?redirect=/profile';
            return;
        }

        const STATUS_LABELS = {
            pending: { text: 'Бронь', color: 'var(--amber)' },
            completed: { text: 'Выкуплен', color: 'var(--green)' },
            cancelled: { text: 'Отменён', color: 'var(--gray-500)' },
            expired: { text: 'Истёк', color: 'var(--red)' }
        };

        async function loadProfile() {
            try {
                const res = await fetch('/api/auth/profile', { headers: Auth.headers() });
                if (res.status === 401) { Auth.logout(); return; }
                const data = await res.json();
                const user = data.user || data;
                localStorage.setItem('user', JSON.stringify(user));
                renderProfile(user);
                fillEditForm(user);
            } catch {
                toast('Не удалось загрузить профиль', 'error');
            }
        }

        function renderProfile(u) {
            document.getElementById('profileAvatar').textContent = (u.name || u.username || u.email || 'U').charAt(0).toUpperCase();
            document.getElementById('profileName').textContent = u.name || u.username || '';
            document.getElementById('profileEmail').textContent = u.email || '';
            document.getElementById('profilePhone').textContent = u.phone || '';
        }

        function fillEditForm(u) {
            const f = document.getElementById('editForm');
            f.name.value = u.name || '';
            f.phone.value = u.phone || '';
            f.email.value = u.email || '';
        }

        async function loadOrders() {
            const list = document.getElementById('ordersList');
            try {
                const res = await fetch('/api/orders', { headers: Auth.headers() });
                if (res.status === 401) { Auth.logout(); return; }
                const data = await res.json();
                const orders = data.orders || data || [];
                if (orders.length === 0) {
                    list.innerHTML = '<p style="color:var(--gray-500);text-align:center;padding:20px">Заказов пока нет. <a href="/catalog">К каталогу →</a></p>';
                    return;
                }
                list.innerHTML = `
                    <table class="order-history-table">
                        <thead>
                            <tr><th>№</th><th>Дата</th><th>Сумма</th><th>Статус</th><th></th></tr>
                        </thead>
                        <tbody>
                            ${orders.map((o) => {
                                const id = o.ID || o.id;
                                const status = o.Status || o.status || 'pending';
                                const sLabel = STATUS_LABELS[status] || { text: status, color: 'var(--gray-500)' };
                                const total = o.TotalPrice || o.total_price || 0;
                                const created = (o.CreatedAt || o.created_at || '').slice(0, 16).replace('T', ' ');
                                return `
                                    <tr>
                                        <td>#${id}</td>
                                        <td>${escapeHtml(created)}</td>
                                        <td>${formatPrice(total)}</td>
                                        <td><span style="color:${sLabel.color};font-weight:600">${sLabel.text}</span></td>
                                        <td>${status === 'pending' ? `<button class="btn btn-sm btn-outline" data-cancel="${id}">Отменить</button>` : ''}</td>
                                    </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                `;
                list.querySelectorAll('[data-cancel]').forEach((btn) => {
                    btn.onclick = () => cancelOrder(Number(btn.dataset.cancel));
                });
            } catch {
                list.innerHTML = '<p style="color:var(--red);text-align:center;padding:20px">Ошибка загрузки заказов</p>';
            }
        }

        async function cancelOrder(id) {
            if (!confirm('Отменить бронь?')) return;
            try {
                const res = await fetch(`/api/orders/${id}/cancel`, { method: 'POST', headers: Auth.headers() });
                if (!res.ok) throw new Error((await res.json()).error || 'Ошибка');
                toast('Бронь отменена', 'success');
                loadOrders();
            } catch (err) {
                toast(err.message, 'error');
            }
        }

        // Edit modal
        const modal = document.getElementById('editModal');
        document.getElementById('editProfileBtn').onclick = () => modal.classList.add('open');
        document.getElementById('editClose').onclick = () => modal.classList.remove('open');
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const btn = e.target.querySelector('button');
            btn.disabled = true; btn.textContent = 'Сохранение...';
            try {
                const res = await fetch('/api/auth/profile', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', ...Auth.headers() },
                    body: JSON.stringify({
                        name: fd.get('name'),
                        phone: fd.get('phone'),
                        email: fd.get('email')
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Ошибка');
                toast('Профиль обновлён', 'success');
                modal.classList.remove('open');
                loadProfile();
            } catch (err) {
                toast(err.message, 'error');
            } finally {
                btn.disabled = false; btn.textContent = 'Сохранить';
            }
        });

        loadProfile();
        loadOrders();
    })();
    </script>
</body>
</html>
