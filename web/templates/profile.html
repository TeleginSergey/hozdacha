<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — ХозДача</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .profile-wrap { max-width: 800px; margin: 30px auto; background: white; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 24px; }
        .profile-top { display: flex; gap: 20px; align-items: center; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .avatar-lg { width: 80px; height: 80px; border-radius: 50%; background: #8B6F47; color: white; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; flex-shrink: 0; }
        .profile-top-info h2 { margin: 0 0 6px; font-size: 1.3rem; }
        .profile-top-info p { margin: 3px 0; color: #666; font-size: 0.9rem; }
        .section-title { font-size: 1.05rem; font-weight: 700; color: #4A7C59; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 2px solid #4A7C59; }
        .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .form-row label { font-weight: 600; font-size: 0.9rem; color: #333; }
        .form-row input { padding: 10px 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 0.95rem; }
        .btn { background: #4A7C59; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 0.95rem; text-decoration: none; display: inline-block; }
        .btn:hover { background: #3D6B4A; }
        .btn-danger { background: #C62828; }
        .btn-danger:hover { background: #B71C1C; }
        .btn-outline-brown { background: transparent; color: #8B6F47; border: 2px solid #8B6F47; }
        .btn-outline-brown:hover { background: #8B6F47; color: white; }
        .msg { padding: 10px 14px; border-radius: 5px; margin-bottom: 12px; display: none; font-size: 0.9rem; }
        .msg-ok { background: #E8F5E9; color: #2E7D32; }
        .msg-err { background: #FFEBEE; color: #C62828; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>ХозДача</h1>
            <nav class="main-nav">
                <a href="/">Главная</a>
                <a href="/catalog">Каталог</a>
                <a href="/cart">Корзина</a>
            </nav>
            <div class="user-area" id="userArea">
                <div class="auth-buttons" id="authButtons">
                    <a href="/register" class="btn btn-outline">Регистрация</a>
                    <a href="/login" class="btn btn-primary">Вход</a>
                </div>
                <a href="/profile" id="userMenu" style="display:none;text-decoration:none">
                    <div class="user-avatar"><span id="avatarLetter">U</span></div>
                    <span class="user-greeting" id="userGreeting"></span>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="profile-wrap">
            <div class="profile-top">
                <div class="avatar-lg" id="profileInitial">U</div>
                <div class="profile-top-info">
                    <h2 id="profileName">Загрузка...</h2>
                    <p id="profileEmail"></p>
                    <p id="profilePhone"></p>
                </div>
                <button class="btn btn-danger" style="margin-left:auto" id="logoutBtn">Выйти</button>
            </div>

            <div class="msg msg-err" id="msgErr"></div>
            <div class="msg msg-ok" id="msgOk"></div>

            <div style="margin-bottom:24px">
                <a href="/orders" class="btn btn-outline-brown">📋 Мои заказы</a>
            </div>

            <div>
                <h3 class="section-title">Изменить данные</h3>
                <form id="editForm">
                    <div class="form-row"><label>Имя</label><input name="name" required minlength="2"></div>
                    <div class="form-row"><label>Телефон *</label><input name="phone" required type="tel" placeholder="+7 (999) 123-45-67"></div>
                    <button type="submit" class="btn">Сохранить</button>
                </form>
            </div>
        </div>
    </main>

    <footer><div class="container"><p>&copy; <span class="footer-year"></span> ХозДача</p></div></footer>

    <script>
    const token = localStorage.getItem('auth_token');
    if (!token) location.href = '/login';

    const api = (url, opts = {}) => fetch(url, { ...opts, headers: { ...opts.headers, Authorization: 'Bearer ' + token } });

    function showMsg(el, text) { el.textContent = text; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 3500); }

    async function loadProfile() {
        try {
            const r = await api('/api/auth/profile');
            if (r.status === 401) { logout(); return; }
            const d = await r.json();
            const u = d.user || d;
            localStorage.setItem('user', JSON.stringify(u));
            document.getElementById('profileName').textContent = u.full_name || u.username || '—';
            document.getElementById('profileEmail').textContent = u.email || '';
            document.getElementById('profilePhone').textContent = u.phone || '';
            document.getElementById('profileInitial').textContent = (u.full_name || u.username || u.email || 'U').charAt(0).toUpperCase();
            document.getElementById('avatarLetter').textContent = (u.full_name || u.username || u.email || 'U').charAt(0).toUpperCase();
            document.getElementById('userGreeting').textContent = 'Здравствуйте, ' + (u.full_name || u.username || 'Гость');
            document.querySelector('[name=name]').value = u.full_name || '';
            document.querySelector('[name=phone]').value = u.phone || '';
            document.getElementById('authButtons').style.display = 'none';
            document.getElementById('userMenu').style.display = 'flex';
        } catch { showMsg(msgErr, 'Не удалось загрузить'); }
    }

    document.getElementById('editForm').onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const name = fd.get('name').trim();
        const phone = fd.get('phone').trim();

        if (name.length < 2) { showMsg(msgErr, 'Имя должно быть не короче 2 букв'); return; }
        if (!phone) { showMsg(msgErr, 'Укажите телефон'); return; }
        if (!/^[\d\s\+\-\(\)]{7,20}$/.test(phone)) { showMsg(msgErr, 'Неверный формат телефона'); return; }

        try {
            const r = await api('/api/auth/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ full_name: name, phone: phone })
            });
            const d = await r.json();
            if (!r.ok) throw new Error(d.error || 'Ошибка');
            showMsg(msgOk, 'Сохранено!');
            loadProfile();
        } catch (err) { showMsg(msgErr, err.message); }
    };

    function logout() { localStorage.removeItem('auth_token'); localStorage.removeItem('user'); location.href = '/login'; }
    document.getElementById('logoutBtn').onclick = logout;

    loadProfile();
    </script>
    <script>document.querySelectorAll(".footer-year").forEach(function(e){e.textContent=new Date().getFullYear()})</script>
</body>
</html>
