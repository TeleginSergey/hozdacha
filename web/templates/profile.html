<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — ХозДача</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .profile-wrap { max-width: 800px; margin: 30px auto; background: white; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 24px; }
        .profile-top { display: flex; gap: 20px; align-items: center; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .avatar-lg { width: 80px; height: 80px; border-radius: 50%; background: #5D4037; color: white; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; flex-shrink: 0; }
        .profile-top-info h2 { margin: 0 0 6px; font-size: 1.3rem; }
        .profile-top-info p { margin: 3px 0; color: #666; font-size: 0.9rem; }
        .section-title { font-size: 1.05rem; font-weight: 700; color: #5D4037; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 2px solid #5D4037; }
        .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .form-row label { font-weight: 600; font-size: 0.9rem; color: #333; }
        .form-row input { padding: 10px 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 0.95rem; }
        .btn { background: #5D4037; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
        .btn:hover { background: #3E2723; }
        .btn-danger { background: #C62828; }
        .btn-danger:hover { background: #B71C1C; }
        .msg { padding: 10px 14px; border-radius: 5px; margin-bottom: 12px; display: none; font-size: 0.9rem; }
        .msg-ok { background: #E8F5E9; color: #2E7D32; }
        .msg-err { background: #FFEBEE; color: #C62828; }
        .order-card { background: #faf7f2; padding: 14px; border-radius: 6px; margin-bottom: 10px; border-left: 4px solid #5D4037; }
        .order-card-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: 600; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .badge-pending { background: #FFF3E0; color: #F57F17; }
        .badge-completed { background: #E8F5E9; color: #2E7D32; }
        .badge-cancelled { background: #eee; color: #888; }
        .badge-expired { background: #FFEBEE; color: #C62828; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>ХозДача</h1>
            <nav class="main-nav">
                <a href="/">Главная</a>
                <a href="/catalog">Каталог</a>
                <a href="/cart">Корзина</a>
            </nav>
            <div class="user-area" id="userArea">
                <div class="auth-buttons" id="authButtons">
                    <a href="/register" class="btn btn-outline">Регистрация</a>
                    <a href="/login" class="btn btn-primary">Вход</a>
                </div>
                <div class="user-menu" id="userMenu" style="display:none">
                    <div class="user-avatar" id="userAvatar"><span id="avatarLetter">U</span></div>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <a href="/profile">Профиль</a>
                        <a href="#" id="logoutLink">Выход</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="profile-wrap">
            <div class="profile-top">
                <div class="avatar-lg" id="profileInitial">U</div>
                <div class="profile-top-info">
                    <h2 id="profileName">Загрузка...</h2>
                    <p id="profileEmail"></p>
                    <p id="profilePhone"></p>
                </div>
                <button class="btn btn-danger" style="margin-left:auto" id="logoutBtn">Выйти</button>
            </div>

            <div class="msg msg-err" id="msgErr"></div>
            <div class="msg msg-ok" id="msgOk"></div>

            <div style="margin-bottom:28px">
                <h3 class="section-title">Редактирование</h3>
                <form id="editForm">
                    <div class="form-row"><label>Имя</label><input name="name" required></div>
                    <div class="form-row"><label>Телефон</label><input name="phone" required></div>
                    <div class="form-row"><label>Адрес</label><input name="address"></div>
                    <button type="submit" class="btn">Сохранить</button>
                </form>
            </div>

            <div>
                <h3 class="section-title">Мои заказы</h3>
                <div id="ordersList"><p style="color:#888">Загрузка...</p></div>
            </div>
        </div>
    </div>

    <footer><div class="container"><p>&copy; 2024 ХозДача</p></div></footer>

    <script>
    const token = localStorage.getItem('auth_token');
    if (!token) location.href = '/login';

    const api = (url, opts = {}) => fetch(url, { ...opts, headers: { ...opts.headers, Authorization: 'Bearer ' + token } });

    function showMsg(el, text) { el.textContent = text; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 3500); }

    async function loadProfile() {
        try {
            const r = await api('/api/auth/profile');
            if (r.status === 401) { logout(); return; }
            const d = await r.json();
            const u = d.user || d;
            localStorage.setItem('user', JSON.stringify(u));
            document.getElementById('profileName').textContent = u.full_name || u.username || '—';
            document.getElementById('profileEmail').textContent = u.email || '';
            document.getElementById('profilePhone').textContent = u.phone || '';
            document.getElementById('profileInitial').textContent = (u.full_name || u.username || u.email || 'U').charAt(0).toUpperCase();
            document.getElementById('avatarLetter').textContent = (u.full_name || u.username || u.email || 'U').charAt(0).toUpperCase();
            document.querySelector('[name=name]').value = u.full_name || '';
            document.querySelector('[name=phone]').value = u.phone || '';
            document.getElementById('authButtons').style.display = 'none';
            document.getElementById('userMenu').style.display = 'flex';
        } catch { showMsg(msgErr, 'Ошибка загрузки'); }
    }

    async function loadOrders() {
        try {
            const r = await api('/api/orders');
            const orders = await r.json();
            const list = document.getElementById('ordersList');
            if (!orders || orders.length === 0) { list.innerHTML = '<p style="color:#888">Заказов пока нет</p>'; return; }
            const labels = { pending: ['В обработке', 'badge-pending'], completed: ['Выполнен', 'badge-completed'], cancelled: ['Отменён', 'badge-cancelled'], expired: ['Истёк', 'badge-expired'] };
            list.innerHTML = orders.map(o => {
                const [txt, cls] = labels[o.status || o.Status] || [o.status || '?', ''];
                return `<div class="order-card">
                    <div class="order-card-header"><span>Заказ #${o.id || o.ID}</span><span class="badge ${cls}">${txt}</span></div>
                    <div>Сумма: ${o.total_price || o.TotalPrice || 0} ₽</div>
                    <div style="font-size:0.85rem;color:#888">${(o.created_at || o.CreatedAt || '').slice(0,10)}</div>
                </div>`;
            }).join('');
        } catch { document.getElementById('ordersList').innerHTML = '<p style="color:red">Ошибка</p>'; }
    }

    document.getElementById('editForm').onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        try {
            const r = await api('/api/auth/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ full_name: fd.get('name'), phone: fd.get('phone') })
            });
            const d = await r.json();
            if (!r.ok) throw new Error(d.error || 'Ошибка');
            showMsg(msgOk, 'Сохранено!');
            loadProfile();
        } catch (err) { showMsg(msgErr, err.message); }
    };

    function logout() { localStorage.removeItem('auth_token'); localStorage.removeItem('user'); location.href = '/login'; }
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('logoutLink').onclick = (e) => { e.preventDefault(); logout(); };

    document.getElementById('userAvatar').onclick = () => {
        const dd = document.getElementById('dropdownMenu');
        dd.style.display = dd.style.display === 'block' ? 'none' : 'block';
    };
    document.addEventListener('click', (e) => {
        if (!document.getElementById('userMenu').contains(e.target)) document.getElementById('dropdownMenu').style.display = 'none';
    });

    loadProfile();
    loadOrders();
    </script>
</body>
</html>
