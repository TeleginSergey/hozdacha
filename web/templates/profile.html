<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a7c59">
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="48x48" href="/static/images/favicon-48.png">
    <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
    <title>Личный кабинет — ХозДача</title>
    <link rel="stylesheet" href="/static/css/style.css?v=27">
</head>
<body>

{{ template "header.html" . }}

<main>
    <div class="container" style="max-width:800px">
        <div class="card">
            <div class="profile-head">
                <div class="avatar-lg" id="profileInitial">U</div>
                <div class="profile-info" style="flex:1;min-width:0">
                    <h2 id="profileName">Загрузка...</h2>
                    <p>📧 <span id="profileEmail"></span></p>
                    <p>📱 <span id="profilePhone"></span></p>
                </div>
                <button class="btn btn--danger" id="logoutBtn">Выйти</button>
            </div>

            <div id="msgErr" class="msg msg-error"></div>
            <div id="msgOk" class="msg msg-success"></div>

            <div style="margin-bottom:var(--sp-5)">
                <a href="/orders" class="btn btn--outline">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                    Мои заказы
                </a>
            </div>

            <h3 class="section-title">Личные данные</h3>
            <form id="editForm">
                <div class="form-row">
                    <label>Имя</label>
                    <input name="name" required minlength="2" maxlength="32" placeholder="Иван Петров">
                </div>
                <div class="form-row">
                    <label>Телефон <span style="color:var(--c-muted);font-weight:400">(обязательно)</span></label>
                    <input name="phone" required type="tel" placeholder="+7 (999) 123-45-67">
                </div>
                <button type="submit" class="btn">Сохранить</button>
            </form>
        </div>
    </div>
</main>

<footer class="site-footer">
    <div class="container">
        <div class="site-footer__bottom">© <span class="footer-year"></span> ХозДача. Все права защищены.</div>
    </div>
</footer>

<script src="/static/js/header.js?v=3"></script>
<script>
const token = localStorage.getItem('auth_token');
if (!token) location.href = '/login';

const api = (url, opts = {}) => fetch(url, { ...opts, headers: { ...opts.headers, Authorization: 'Bearer ' + token } });

function showMsg(el, text) {
    el.textContent = text;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
}

async function loadProfile() {
    const msgErr = document.getElementById('msgErr');
    try {
        const r = await api('/api/auth/profile');
        if (r.status === 401) { logout(); return; }
        const d = await r.json();
        const u = d.user || d;
        localStorage.setItem('user', JSON.stringify(u));
        const name = u.full_name || u.username || '—';
        document.getElementById('profileName').textContent = name;
        document.getElementById('profileEmail').textContent = u.email || '—';
        document.getElementById('profilePhone').textContent = u.phone || '—';
        document.getElementById('profileInitial').textContent = (u.full_name || u.username || u.email || 'U').charAt(0).toUpperCase();
        document.getElementById('avatarLetter').textContent = (u.full_name || u.username || u.email || 'U').charAt(0).toUpperCase();
        document.getElementById('userGreeting').textContent = name;
        document.querySelector('[name=name]').value = u.full_name || '';
        document.querySelector('[name=phone]').value = u.phone || '';
    } catch { showMsg(msgErr, 'Не удалось загрузить профиль'); }
}

document.getElementById('editForm').onsubmit = async (e) => {
    e.preventDefault();
    const msgErr = document.getElementById('msgErr');
    const msgOk = document.getElementById('msgOk');
    const fd = new FormData(e.target);
    const name = fd.get('name').trim();
    const phone = fd.get('phone').trim();

    if (name.length < 2) { showMsg(msgErr, 'Имя должно быть не короче 2 букв'); return; }
    if (name.length > 32) { showMsg(msgErr, 'Имя не должно быть длиннее 32 символов'); return; }
    if (!phone) { showMsg(msgErr, 'Укажите телефон'); return; }
    const phoneDigits = phone.replace(/\D/g, '');
    if (phoneDigits.length !== 11 || !/^(7|8)/.test(phoneDigits)) {
        showMsg(msgErr, 'Введите номер в формате +7 999 123-45-67');
        return;
    }

    try {
        const r = await api('/api/auth/profile', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ full_name: name, phone: phone })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Ошибка');
        showMsg(msgOk, '✅ Сохранено!');
        loadProfile();
    } catch (err) { showMsg(msgErr, err.message); }
};

function logout() {
    localStorage.removeItem('auth_token');
    localStorage.removeItem('user');
    location.href = '/login';
}
document.getElementById('logoutBtn').onclick = logout;

loadProfile();
</script>
<script>document.querySelectorAll(".footer-year").forEach(function(e){e.textContent=new Date().getFullYear()})</script>
</body>
</html>
