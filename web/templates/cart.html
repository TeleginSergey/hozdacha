<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — ХозДача</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div data-header-slot></div>
    <main class="container">
        <h1 style="margin:24px 0">🛒 Корзина</h1>
        <div id="cartPage"></div>
    </main>
    <div data-footer-slot></div>
    <script src="/static/js/app.js"></script>
    <script>
    (function () {
        const { Cart, escapeHtml, formatPrice, PLACEHOLDER_IMG, startCheckout } = App;

        function render() {
            const items = Cart.items();
            const root = document.getElementById('cartPage');
            if (items.length === 0) {
                root.innerHTML = `
                    <div style="background:white;padding:60px;text-align:center;border-radius:10px;box-shadow:var(--shadow-sm)">
                        <div style="font-size:4rem;margin-bottom:12px">🛒</div>
                        <h2>Корзина пуста</h2>
                        <p style="color:var(--gray-600);margin:12px 0 20px">Добавьте товары из каталога</p>
                        <a href="/catalog" class="btn btn-primary">К каталогу</a>
                    </div>`;
                return;
            }
            root.innerHTML = `
                <div style="background:white;padding:24px;border-radius:10px;box-shadow:var(--shadow-sm)">
                    ${items.map((it) => `
                        <div class="cart-item-row" data-id="${it.id}">
                            <img class="cart-item-img" src="${escapeHtml(it.image) || PLACEHOLDER_IMG}" onerror="this.src='${PLACEHOLDER_IMG}'">
                            <div class="cart-item-info">
                                <div class="cart-item-name"><a href="/product/${it.id}">${escapeHtml(it.name)}</a></div>
                                <div class="cart-item-price">${formatPrice(it.price)} × ${it.quantity} = <strong>${formatPrice(it.price * it.quantity)}</strong></div>
                                <div class="cart-item-qty">
                                    <button data-action="dec">−</button>
                                    <span>${it.quantity}</span>
                                    <button data-action="inc">+</button>
                                </div>
                            </div>
                            <button class="cart-item-remove" data-action="remove">🗑️</button>
                        </div>
                    `).join('')}
                    <div class="cart-total-row" style="margin-top:20px;padding-top:20px;border-top:2px solid var(--gray-200)">
                        <span>Итого:</span>
                        <span>${formatPrice(Cart.total())}</span>
                    </div>
                    <button class="btn btn-accent" style="width:100%;margin-top:12px" id="goCheckout">Оформить заказ</button>
                </div>`;

            root.querySelectorAll('.cart-item-row').forEach((row) => {
                const id = Number(row.dataset.id);
                row.querySelector('[data-action="dec"]').onclick = () => {
                    const i = Cart.items().find((x) => x.id === id);
                    if (i) Cart.setQty(id, i.quantity - 1);
                    render();
                };
                row.querySelector('[data-action="inc"]').onclick = () => {
                    const i = Cart.items().find((x) => x.id === id);
                    if (i) Cart.setQty(id, i.quantity + 1);
                    render();
                };
                row.querySelector('[data-action="remove"]').onclick = () => {
                    Cart.remove(id);
                    render();
                };
            });

            document.getElementById('goCheckout').onclick = startCheckout;
        }

        document.addEventListener('DOMContentLoaded', render);
        window.addEventListener('cart:changed', render);
    })();
    </script>
</body>
</html>
