<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои заказы — ХозДача</title>
    <link rel="stylesheet" href="/static/css/style.css?v=23">
</head>
<body>

{{ template "header.html" . }}

<main>
    <div class="container">
        <div style="max-width:900px;margin:0 auto">
            <h2 style="font-size:var(--fs-3xl);font-weight:800;margin-bottom:var(--sp-5)">📋 Мои заказы</h2>
            <div id="ordersContent"></div>
        </div>
    </div>
</main>

<footer class="site-footer">
    <div class="container">
        <div class="site-footer__bottom">© <span class="footer-year"></span> ХозДача. Все права защищены.</div>
    </div>
</footer>

<script src="/static/js/header.js?v=3"></script>
<script>
const token = localStorage.getItem('auth_token');
if (!token) location.href = '/login';

const labels = {
    pending: ['В обработке', 'badge--pending'],
    completed: ['Выполнен', 'badge--completed'],
    cancelled: ['Отменён', 'badge--cancelled'],
    expired: ['Истёк', 'badge--expired']
};

async function loadOrders() {
    const el = document.getElementById('ordersContent');
    try {
        const r = await fetch('/api/orders', { headers: { Authorization: 'Bearer ' + token } });
        if (r.status === 401) { localStorage.removeItem('auth_token'); location.href = '/login'; return; }
        const orders = await r.json();
        if (!orders || orders.length === 0) {
            el.innerHTML = `<div class="empty-state">
                <div class="empty-state__icon">📋</div>
                <h3>Заказов пока нет</h3>
                <p>Вы ещё ничего не заказывали</p>
                <a href="/catalog" class="btn btn--lg">К каталогу</a>
            </div>`;
            return;
        }
        el.innerHTML = orders.map(o => {
            const [statusText, statusClass] = labels[o.status] || [o.status, ''];
            const isPending = o.status === 'pending';
            const itemsHTML = (o.items || []).map(i => `
                <div class="item-row">
                    <span class="item-row__name">${esc(i.product_name || 'Товар #'+i.product_id)}</span>
                    <span class="item-row__qty">×${i.quantity}</span>
                    <span class="item-row__price">${i.price.toFixed(0)} ₽</span>
                    <span class="item-row__sub">${(i.price * i.quantity).toFixed(0)} ₽</span>
                </div>
            `).join('');
            const reservedUntil = o.reserved_until
                ? '<div style="font-size:var(--fs-sm);color:var(--c-warn);background:var(--c-warn-bg);padding:6px 10px;border-radius:var(--r-sm);display:inline-block">⏳ Заказ до: ' + fmtDt(o.reserved_until) + '</div>'
                : '';
            const pickupAt = o.pickup_at
                ? '<div style="font-size:var(--fs-sm);color:var(--c-success);background:var(--c-success-bg);padding:6px 10px;border-radius:var(--r-sm);display:inline-block">🕐 Самовывоз: ' + fmtDt(o.pickup_at) + '</div>'
                : '';
            const meta = [pickupAt, reservedUntil].filter(Boolean).join(' ');
            const cancelBtn = isPending
                ? `<button onclick="cancelOrder(${o.id}, this)" class="btn btn--danger btn--sm" style="margin-top:var(--sp-2)">Отменить заказ</button>`
                : '';
            return `<div class="order-card" id="order-${o.id}">
                <div class="order-card__head">
                    <span class="order-card__id">Заказ #${o.id} <span class="badge ${statusClass}">${statusText}</span></span>
                    <span class="order-card__date">${(o.created_at || '').slice(0,10)}</span>
                </div>
                ${itemsHTML}
                <div class="order-card__foot">
                    <div class="order-card__meta">${meta || '&nbsp;'}</div>
                    <div class="order-card__total">${o.total_price.toFixed(0)} ₽</div>
                </div>
                ${cancelBtn}
            </div>`;
        }).join('');
    } catch {
        el.innerHTML = '<div class="empty-state"><p style="color:var(--c-danger)">Не удалось загрузить заказы</p></div>';
    }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function fmtDt(s) {
    if (!s) return '—';
    try { return new Date(s).toLocaleString('ru-RU', { dateStyle: 'short', timeStyle: 'short' }); }
    catch (e) { return '—'; }
}

async function cancelOrder(id, btn) {
    if (!confirm('Отменить заказ №' + id + '?')) return;
    btn.disabled = true;
    btn.textContent = 'Отмена...';
    try {
        const r = await fetch('/api/orders/' + id + '/cancel', {
            method: 'POST', headers: { Authorization: 'Bearer ' + token }
        });
        if (r.ok) {
            const card = document.getElementById('order-' + id);
            if (card) {
                const badge = card.querySelector('.badge');
                badge.className = 'badge badge--cancelled';
                badge.textContent = 'Отменён';
                btn.remove();
            }
        } else {
            const err = await r.json().catch(() => ({}));
            alert('Ошибка: ' + (err.error || r.status));
            btn.disabled = false;
            btn.textContent = 'Отменить заказ';
        }
    } catch {
        alert('Ошибка соединения');
        btn.disabled = false;
        btn.textContent = 'Отменить заказ';
    }
}

loadOrders();
</script>
<script>document.querySelectorAll(".footer-year").forEach(function(e){e.textContent=new Date().getFullYear()})</script>
</body>
</html>
