{{define "header.html"}}
<header class="site-header">
    <div class="container site-header__inner">
        <a href="/" class="brand" data-nav="home">
            <span class="brand__mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </span>
            <span>ХозДача</span>
        </a>
        <nav class="main-nav" id="siteMainNav">
            <a href="/" data-nav="home">Главная</a>
            <a href="/catalog" data-nav="catalog">Каталог</a>
            <a href="/promotions" data-nav="promotions">Акции</a>
            <a href="/cart" data-nav="cart">Корзина</a>
        </nav>
        <div class="header-actions" id="userArea">
            <a href="/cart" class="icon-btn" aria-label="Корзина" data-nav="cart">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span class="icon-btn__badge" id="headerCartCount" style="display:none">0</span>
            </a>
            <div class="auth-buttons" id="authButtons">
                <a href="/register" class="btn btn--outline btn--sm">Регистрация</a>
                <a href="/login" class="btn btn--sm">Вход</a>
            </div>
            <a href="/profile" id="userMenu" class="user-menu" style="display:none" data-nav="profile">
                <span class="user-avatar" id="avatarLetter">U</span>
                <span class="user-greeting" id="userGreeting"></span>
            </a>
        </div>
    </div>
</header>
{{end}}
