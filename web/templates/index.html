<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ХозДача — хозяйственные товары для дома и дачи</title>
    <meta name="description" content="ХозДача — магазин хозяйственных товаров, инструментов и инвентаря для сада и дачи.">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div data-header-slot></div>

    <main class="container">
        <section class="hero">
            <h2>Всё для дома, дачи и хозяйства</h2>
            <p>Инструменты · Сад · Хозтовары · Инвентарь</p>
            <form class="hero-search" onsubmit="event.preventDefault(); window.location.href='/catalog?q='+encodeURIComponent(this.q.value)">
                <input name="q" type="search" placeholder="Что ищем? Например: грабли, перчатки, шланг..." autocomplete="off">
                <button type="submit">Найти</button>
            </form>
        </section>

        <section class="section">
            <div class="section-header">
                <h2>🔥 Хиты продаж</h2>
                <a href="/catalog" class="btn btn-outline btn-sm">Весь каталог →</a>
            </div>
            <div class="product-grid" id="featuredGrid">
                <p style="grid-column:1/-1;text-align:center;color:var(--gray-500)">Загрузка...</p>
            </div>
        </section>

        <section class="section">
            <h2>🎁 Акции</h2>
            <div class="product-grid" id="promotionsGrid">
                <p style="grid-column:1/-1;text-align:center;color:var(--gray-500)">Загрузка акций...</p>
            </div>
        </section>
    </main>

    <div data-footer-slot></div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/home.js"></script>
</body>
</html>
