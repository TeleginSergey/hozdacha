<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}} - ХозДача</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>ХозДача</h1>
            <nav>
                <a href="/">Главная</a>
                <a href="/catalog">Каталог</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div style="text-align: center; padding: 3rem 0;">
            <h2>{{.title}}</h2>
            <p>{{.message}}</p>
            <a href="/catalog" class="btn">Вернуться в каталог</a>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span class="footer-year"></span> ХозДача</p>
        </div>
    </footer>
<script>document.querySelectorAll(".footer-year").forEach(function(e){e.textContent=new Date().getFullYear()})</script>
</body>
</html>
