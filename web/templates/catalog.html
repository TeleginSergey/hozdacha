<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}} - ХозДача</title>
    <link rel="stylesheet" href="/static/css/style.css?v=15">
</head>
<body>
    <header>
        <div class="container">
            <h1>ХозДача</h1>
            <nav class="main-nav">
                <a href="/">Главная</a>
                <a href="/catalog">Каталог</a>
                <a href="/cart">Корзина</a>
            </nav>
            <div class="user-area" id="userArea">
                <div class="auth-buttons" id="authButtons">
                    <a href="/register" class="btn btn-outline">Регистрация</a>
                    <a href="/login" class="btn btn-primary">Вход</a>
                </div>
                <a href="/profile" id="userMenu" style="display:none;text-decoration:none">
                    <div class="user-avatar" id="userAvatar">
                        <span id="avatarLetter">U</span>
                    </div>
                    <span class="user-greeting" id="userGreeting"></span>
                </a>
            </div>
        </div>
    </header>

    <main class="catalog-layout">
        <!-- Боковая панель: дерево категорий -->
        <aside class="catalog-sidebar" id="catalogSidebar">
            <div class="sidebar-header">
                <h3>Категории</h3>
                <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="Скрыть">✕</button>
            </div>
            <div class="sidebar-search">
                <input type="text" id="sidebarSearch" placeholder="Поиск категории..." oninput="filterCategoryTree()">
            </div>
            <nav class="category-tree" id="categoryTree">
                <div class="tree-loading">Загрузка...</div>
            </nav>
        </aside>
        <!-- Overlay для мобильного sidebar -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

        <!-- Основная область: поиск + товары + пагинация -->
        <div class="catalog-main">
            <div class="catalog-topbar">
                <button class="btn btn-outline sidebar-open-btn" id="sidebarOpenBtn" onclick="toggleSidebar()" title="Категории">☰ Категории</button>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Поиск товаров...">
                    <select id="searchScope" class="search-scope">
                        <option value="">Везде</option>
                    </select>
                    <button onclick="searchProducts()">Найти</button>
                </div>
                <div class="catalog-breadcrumb" id="breadcrumb">
                    <span class="breadcrumb-item active">Все товары</span>
                </div>
            </div>

            <section class="products-grid" id="productsGrid">
                <p>Загрузка товаров...</p>
            </section>

            <div class="pagination" id="paginationContainer"></div>
        </div>

        <div class="cart-section">
            <button class="cart-btn" onclick="showCart()" title="Корзина">🛒<span id="cartCount" style="position:absolute;top:-4px;right:-4px;background:#8B6F47;color:white;border-radius:50%;width:20px;height:20px;font-size:0.7rem;display:flex;align-items:center;justify-content:center;line-height:1">0</span></button>
        </div>
    </main>

    <!-- Модальное окно корзины -->
    <div id="cartModal" class="modal">
        <div class="modal-content" style="max-width:700px;width:95%;padding:24px">
            <span class="close" onclick="closeCart()">&times;</span>
            <h2 style="margin-bottom:16px">🛒 Корзина</h2>
            <div id="cartItems" style="max-height:55vh;overflow-y:auto;margin-bottom:16px"></div>
            <div style="border-top:2px solid #eee;padding-top:16px;display:flex;justify-content:space-between;align-items:center">
                <span style="font-size:1.15rem;font-weight:700;color:#8B6F47">Итого: <span id="cartTotal">0</span> ₽</span>
                <button class="btn" onclick="checkout()" style="background:#FF8F00">Оформить заказ</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно оформления заказа -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeCheckout()">&times;</span>
            <h2>Оформление заказа</h2>
            <p style="color:#C62828;font-size:0.85rem;margin-bottom:14px;background:#FFEBEE;padding:8px 12px;border-radius:5px">Заказ хранится 3 дня. Потом отменится.</p>
            <form id="checkoutForm">
                <div style="margin-bottom:4px">
                    <label style="font-size:0.9rem;font-weight:600;color:#555;display:block;margin-bottom:6px">
                        Когда заберёте? <span style="font-weight:400;color:#888">(можно не указывать)</span>
                    </label>
                    <div style="display:flex;gap:8px">
                        <select id="pickupDate" style="flex:1;padding:9px 10px;border:1px solid #ddd;border-radius:5px;font-size:0.95rem;color:#333;background:#fff">
                            <option value="">— дата —</option>
                        </select>
                        <select id="pickupTime" style="flex:1;padding:9px 10px;border:1px solid #ddd;border-radius:5px;font-size:0.95rem;color:#333;background:#fff">
                            <option value="">— время —</option>
                        </select>
                    </div>
                </div>
                <textarea name="comment" placeholder="Примечание к заказу (не обязательно)"></textarea>
                <button type="submit" class="btn">Подтвердить заказ</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; <span class="footer-year"></span> ХозДача</p>
        </div>
    </footer>

    <script>
    // Check user authentication state
    function checkAuthState() {
        const token = localStorage.getItem('auth_token');
        const user = localStorage.getItem('user');
        
        if (token && user) {
            showUserMenu(JSON.parse(user));
        } else {
            showAuthButtons();
        }
    }

    // Show user menu with avatar
    function showUserMenu(user) {
        const authButtons = document.getElementById('authButtons');
        const userMenu = document.getElementById('userMenu');
        const avatarLetter = document.getElementById('avatarLetter');
        
        // Hide auth buttons, show user menu
        authButtons.style.display = 'none';
        userMenu.style.display = 'flex';
        
        // Set avatar letter (first letter of name, then username, then email)
        const name = user.full_name || user.username || user.email || 'U';
        avatarLetter.textContent = name.charAt(0).toUpperCase();
        document.getElementById('userGreeting').textContent = 'Здравствуйте, ' + (user.full_name || user.username || 'Гость');
    }

    // Show auth buttons for guests
    function showAuthButtons() {
        const authButtons = document.getElementById('authButtons');
        const userMenu = document.getElementById('userMenu');
        
        // Show auth buttons, hide user menu
        authButtons.style.display = 'flex';
        userMenu.style.display = 'none';
    }

    // Logout function
    function logout() {
        localStorage.removeItem('auth_token');
        localStorage.removeItem('user');
        showAuthButtons();
        window.location.href = '/login';
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', checkAuthState);
</script>
<script src="/static/js/catalog.js?v=12"></script>
<script>document.querySelectorAll(".footer-year").forEach(function(e){e.textContent=new Date().getFullYear()})</script>
</body>
</html>
