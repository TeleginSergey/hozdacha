<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — ХозДача</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div data-header-slot></div>

    <main class="container">
        <h1 style="margin:24px 0 16px">Каталог</h1>

        <div class="search-bar">
            <input type="search" id="searchInput" placeholder="Поиск товаров..." autocomplete="off">
            <button class="btn btn-primary" id="searchBtn">Найти</button>
        </div>

        <div class="product-grid" id="productsGrid">
            <p style="grid-column:1/-1;text-align:center;color:var(--gray-500);padding:40px">Загрузка...</p>
        </div>

        <div class="pagination" id="pagination"></div>
    </main>

    <div data-footer-slot></div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/catalog.js"></script>
</body>
</html>
