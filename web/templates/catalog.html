<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}} — ХозДача</title>
    <link rel="stylesheet" href="/static/css/style.css?v=18">
</head>
<body>

<header class="site-header">
    <div class="container site-header__inner">
        <a href="/" class="brand">
            <span class="brand__mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></span>
            <span>ХозДача</span>
        </a>
        <nav class="main-nav">
            <a href="/">Главная</a>
            <a href="/catalog" class="active">Каталог</a>
            <a href="/cart">Корзина</a>
        </nav>
        <div class="header-actions" id="userArea">
            <a href="/cart" class="icon-btn" aria-label="Корзина" id="headerCartBtn" style="display:none">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span class="icon-btn__badge" id="headerCartCount" style="display:none">0</span>
            </a>
            <div class="auth-buttons" id="authButtons">
                <a href="/register" class="btn btn--outline btn--sm">Регистрация</a>
                <a href="/login" class="btn btn--sm">Вход</a>
            </div>
            <a href="/profile" id="userMenu" class="user-menu" style="display:none">
                <span class="user-avatar" id="avatarLetter">U</span>
                <span class="user-greeting" id="userGreeting"></span>
            </a>
        </div>
    </div>
</header>

<main>
    <div class="container">
        <div class="catalog-layout">
            <aside class="catalog-sidebar collapsed" id="catalogSidebar">
                <div class="sidebar-header">
                    <h3>Категории</h3>
                    <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="Скрыть">✕</button>
                </div>
                <div class="sidebar-search">
                    <input type="text" id="sidebarSearch" placeholder="Поиск категории..." oninput="filterCategoryTree()">
                </div>
                <nav class="category-tree" id="categoryTree">
                    <div class="tree-loading">Загрузка…</div>
                </nav>
            </aside>
            <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

            <div class="catalog-main">
                <div class="catalog-topbar">
                    <button class="btn btn--outline btn--sm sidebar-open-btn" id="sidebarOpenBtn" onclick="toggleSidebar()" title="Категории">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                        Категории
                    </button>
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="searchInput" placeholder="Поиск товаров...">
                        <select id="searchScope" class="search-scope">
                            <option value="">Везде</option>
                        </select>
                        <button class="btn btn--sm" onclick="searchProducts()">Найти</button>
                    </div>
                    <div class="catalog-breadcrumb" id="breadcrumb">
                        <span class="breadcrumb-item active">Все товары</span>
                    </div>
                </div>

                <section class="products-grid" id="productsGrid">
                    <div style="grid-column:1/-1;text-align:center;color:var(--c-muted);padding:var(--sp-7)">
                        <div class="skeleton" style="height:280px;max-width:280px;margin:0 auto;border-radius:var(--r-lg)"></div>
                        <p style="margin-top:var(--sp-4)">Загрузка товаров…</p>
                    </div>
                </section>

                <div id="catalogScrollSentinel" class="scroll-sentinel" aria-hidden="true"></div>
                <div id="catalogScrollLoader" class="scroll-loader" hidden>Загрузка…</div>
            </div>
        </div>
    </div>
</main>

<!-- Floating cart button -->
<button class="cart-fab" onclick="window.location.href='/cart'" id="cartFab" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
    <span class="cart-fab__label">Корзина</span>
    <span class="cart-fab__count" id="cartCount">0</span>
</button>

<!-- Cart modal -->
<div id="cartModal" class="modal">
    <div class="modal__content" style="max-width:700px">
        <button class="modal__close" onclick="closeCart()" aria-label="Закрыть">✕</button>
        <h2>🛒 Корзина</h2>
        <div id="cartItems" style="max-height:55vh;overflow-y:auto;margin-bottom:var(--sp-4)"></div>
        <div style="border-top:2px solid var(--c-border);padding-top:var(--sp-4);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--sp-3)">
            <span style="font-size:var(--fs-xl);font-weight:800">Итого: <span id="cartTotal">0</span> ₽</span>
            <button class="btn btn--lg" onclick="checkout()">Оформить заказ</button>
        </div>
    </div>
</div>

<!-- Checkout modal -->
<div id="checkoutModal" class="modal">
    <div class="modal__content">
        <button class="modal__close" onclick="closeCheckout()" aria-label="Закрыть">✕</button>
        <h2>Оформление заказа</h2>
        <p style="background:var(--c-warn-bg);color:var(--c-warn);border:1px solid #fde2b8;padding:10px 14px;border-radius:var(--r-md);font-size:var(--fs-sm);margin-bottom:var(--sp-4)">
            ⏳ Заказ хранится 3 дня. Потом автоматически отменится.
        </p>
        <form id="checkoutForm">
            <div class="form-row">
                <label>Когда заберёте? <span style="color:var(--c-muted);font-weight:400">(можно не указывать)</span></label>
                <div style="display:flex;gap:8px">
                    <select id="pickupDate" class="filter-input" style="flex:1">
                        <option value="">— дата —</option>
                    </select>
                    <select id="pickupTime" class="filter-input" style="flex:1">
                        <option value="">— время —</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <label>Примечание к заказу <span style="color:var(--c-muted);font-weight:400">(необязательно)</span></label>
                <textarea name="comment" placeholder="Например: позвоните за 30 минут"></textarea>
            </div>
            <button type="submit" class="btn btn--accent btn--block">Подтвердить заказ</button>
        </form>
    </div>
</div>

<footer class="site-footer">
    <div class="container">
        <div class="site-footer__bottom">© <span class="footer-year"></span> ХозДача. Все права защищены.</div>
    </div>
</footer>

<script>
function checkAuthState() {
    const token = localStorage.getItem('auth_token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (token && user) {
        document.getElementById('authButtons').style.display = 'none';
        document.getElementById('userMenu').style.display = 'flex';
        const name = user.full_name || user.username || user.email || 'U';
        document.getElementById('avatarLetter').textContent = name.charAt(0).toUpperCase();
        document.getElementById('userGreeting').textContent = name;
        document.getElementById('headerCartBtn').style.display = 'inline-grid';
    } else {
        document.getElementById('authButtons').style.display = 'flex';
        document.getElementById('userMenu').style.display = 'none';
    }
}
function updateCartFab() {
    const fab = document.getElementById('cartFab');
    const count = JSON.parse(localStorage.getItem('cart') || '[]').reduce((s, i) => s + (parseInt(i.quantity) || 0), 0);
    const badge = document.getElementById('cartCount');
    const headerBadge = document.getElementById('headerCartCount');
    if (count > 0) {
        fab.style.display = 'inline-flex';
        badge.textContent = count;
        headerBadge.textContent = count;
        headerBadge.style.display = 'grid';
    } else {
        fab.style.display = 'none';
        headerBadge.style.display = 'none';
    }
}
document.addEventListener('DOMContentLoaded', () => { checkAuthState(); updateCartFab(); });
window.addEventListener('storage', updateCartFab);
</script>
<script src="/static/js/infinite-scroll.js?v=1"></script>
<script src="/static/js/product-card.js?v=1"></script>
<script src="/static/js/catalog.js?v=16"></script>
<script>document.querySelectorAll(".footer-year").forEach(function(e){e.textContent=new Date().getFullYear()})</script>
</body>
</html>
