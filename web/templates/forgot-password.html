<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля — ХозДача</title>
    <link rel="stylesheet" href="/static/css/style.css?v=22">
</head>
<body class="auth-page">

<div class="auth-card">
    <a href="/" class="brand" style="justify-content:center;margin-bottom:var(--sp-3)">
        <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </span>
        <span>ХозДача</span>
    </a>
    <h1 class="auth-card__title" id="stepTitle">Сброс пароля</h1>
    <p class="auth-card__sub" id="stepSubtitle">Введите почту — отправим код из 6 цифр</p>

    <div class="steps">
        <div class="step-dot active" id="dot1">1</div>
        <div class="step-line" id="line"></div>
        <div class="step-dot" id="dot2">2</div>
    </div>

    <div id="msgErr" class="msg msg-error"></div>
    <div id="msgOk" class="msg msg-success"></div>

    <div class="step-panel active" id="step-email">
        <form id="email-form">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com" autofocus>
                <div class="hint">На эту почту придёт код для сброса</div>
            </div>
            <button type="submit" class="btn btn--block" id="email-btn">Отправить код</button>
        </form>
        <div class="footer-link">
            <a href="/login">← Вернуться ко входу</a>
        </div>
    </div>

    <div class="step-panel" id="step-reset">
        <button class="back-link" id="back-btn">← Изменить email</button>
        <p style="text-align:center;color:var(--c-text-soft);font-size:var(--fs-sm);margin-bottom:var(--sp-4)">
            Код отправлен на <strong id="email-display" style="color:var(--c-text)"></strong>
        </p>
        <form id="reset-form">
            <div class="field">
                <label for="code">Код из письма</label>
                <input type="text" id="code" name="code" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" required
                       style="text-align:center;font-size:24px;font-weight:700;letter-spacing:8px;font-family:monospace"
                       placeholder="000000">
                <div class="hint">Введите 6 цифр без пробелов</div>
            </div>
            <div class="field">
                <label for="new_password">Новый пароль</label>
                <input type="password" id="new_password" name="new_password" minlength="8" required autocomplete="new-password" placeholder="Минимум 8 символов">
            </div>
            <div class="field">
                <label for="new_password_confirm">Повторите пароль</label>
                <input type="password" id="new_password_confirm" name="new_password_confirm" minlength="8" required autocomplete="new-password" placeholder="Ещё раз">
            </div>
            <button type="submit" class="btn btn--block" id="reset-btn">Сохранить новый пароль</button>
            <div style="text-align:center;margin-top:var(--sp-3)">
                <button type="button" class="back-link" id="resend-btn" style="margin:0">Не пришёл код? Отправить ещё раз</button>
            </div>
        </form>
    </div>

    <div class="step-panel" id="step-done" style="text-align:center">
        <div style="font-size:64px;margin-bottom:var(--sp-3)">✅</div>
        <h2 style="font-size:var(--fs-2xl);font-weight:800;margin-bottom:var(--sp-2)">Пароль изменён</h2>
        <p style="color:var(--c-muted);margin-bottom:var(--sp-5)">Теперь можно войти с новым паролем</p>
        <a href="/login" class="btn btn--lg btn--block">Войти в аккаунт</a>
    </div>
</div>

<script>
const errorDiv = document.getElementById('msgErr');
const successDiv = document.getElementById('msgOk');
let savedEmail = '';

function showStep(name) {
    document.querySelectorAll('.step-panel').forEach(el => el.classList.remove('active'));
    document.getElementById('step-' + name).classList.add('active');
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';

    // обновить заголовок
    const titles = { email: ['Сброс пароля', 'Введите почту — отправим код из 6 цифр'],
                     reset: ['Введите код', 'Код действует 30 минут'],
                     done: ['Готово', 'Пароль успешно изменён'] };
    if (titles[name]) {
        document.getElementById('stepTitle').textContent = titles[name][0];
        document.getElementById('stepSubtitle').textContent = titles[name][1];
    }
    // обновить step-dots
    const dots = [document.getElementById('dot1'), document.getElementById('dot2')];
    const line = document.getElementById('line');
    if (name === 'email') {
        dots[0].className = 'step-dot active';
        dots[1].className = 'step-dot';
        line.classList.remove('done');
    } else if (name === 'reset') {
        dots[0].className = 'step-dot done';
        dots[1].className = 'step-dot active';
        line.classList.add('done');
    } else {
        dots[0].className = 'step-dot done';
        dots[1].className = 'step-dot done';
    }
}

function showError(msg) {
    errorDiv.textContent = msg;
    errorDiv.style.display = 'block';
    successDiv.style.display = 'none';
}
function showSuccess(msg) {
    successDiv.textContent = msg;
    successDiv.style.display = 'block';
    errorDiv.style.display = 'none';
}

async function requestCode(email) {
    const response = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Не удалось отправить код');
    return data;
}

document.getElementById('email-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('email-btn');
    const email = document.getElementById('email').value.trim();
    btn.disabled = true;
    btn.textContent = 'Отправка...';
    try {
        await requestCode(email);
        savedEmail = email;
        document.getElementById('email-display').textContent = email;
        showStep('reset');
        document.getElementById('code').focus();
    } catch (err) {
        showError(err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Отправить код';
    }
});

document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('reset-btn');
    const code = document.getElementById('code').value.trim();
    const newPassword = document.getElementById('new_password').value;
    const confirmPassword = document.getElementById('new_password_confirm').value;

    if (newPassword !== confirmPassword) { showError('Пароли не совпадают'); return; }
    if (newPassword.length < 8) { showError('Пароль должен быть не короче 8 знаков'); return; }
    if (!/^\d{6}$/.test(code)) { showError('Код должен быть из 6 цифр'); return; }

    btn.disabled = true;
    btn.textContent = 'Сохранение...';
    try {
        const response = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: savedEmail, code: code, new_password: newPassword })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Не удалось изменить пароль');
        showStep('done');
    } catch (err) {
        showError(err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Сохранить новый пароль';
    }
});

document.getElementById('resend-btn').addEventListener('click', async () => {
    if (!savedEmail) return;
    const btn = document.getElementById('resend-btn');
    btn.disabled = true;
    btn.textContent = 'Отправка...';
    try {
        await requestCode(savedEmail);
        showSuccess('Новый код отправлен на почту');
    } catch (err) {
        showError(err.message);
    } finally {
        setTimeout(() => {
            btn.disabled = false;
            btn.textContent = 'Не пришёл код? Отправить ещё раз';
        }, 30000);
    }
});

document.getElementById('back-btn').addEventListener('click', () => { showStep('email'); });
document.getElementById('code').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '');
});
</script>
</body>
</html>
