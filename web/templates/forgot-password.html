<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .auth-container {
            max-width: 440px;
            margin: 80px auto;
            padding: 32px 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .auth-container h2 {
            margin-bottom: 8px;
            color: #2C2C2C;
            font-size: 1.6rem;
        }
        .auth-container .subtitle {
            color: #6c757d;
            margin-bottom: 24px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }
        .form-group input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4A7C59;
        }
        .code-input {
            text-align: center;
            font-size: 24px !important;
            font-weight: 600;
            letter-spacing: 8px;
            font-family: 'Courier New', monospace;
        }
        .btn-primary {
            background: #4A7C59;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-primary:hover:not(:disabled) {
            background: #3D6B4A;
        }
        .btn-primary:disabled {
            background: #aaa;
            cursor: not-allowed;
        }
        .btn-link {
            background: none;
            border: none;
            color: #4A7C59;
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.9rem;
            padding: 0;
        }
        .btn-link:hover {
            color: #3D6B4A;
        }
        .error-message,
        .success-message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #6c757d;
        }
        .auth-footer a {
            color: #4A7C59;
            text-decoration: none;
            font-weight: 500;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
        .resend-line {
            text-align: center;
            margin-top: 8px;
            font-size: 0.85rem;
            color: #6c757d;
        }
        @media (max-width: 480px) {
            .auth-container {
                margin: 30px 12px;
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div id="error-message" class="error-message" style="display: none;"></div>
            <div id="success-message" class="success-message" style="display: none;"></div>

            <!-- Шаг 1: ввод email -->
            <div id="step-email" class="step active">
                <h2>Сброс пароля</h2>
                <p class="subtitle">Введите email — мы отправим 6-значный код для подтверждения.</p>
                <form id="email-form" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required autocomplete="email">
                    </div>
                    <button type="submit" class="btn-primary" id="email-btn">Отправить код</button>
                </form>
                <div class="auth-footer">
                    <a href="/login">← Вернуться ко входу</a>
                </div>
            </div>

            <!-- Шаг 2: код + новый пароль -->
            <div id="step-reset" class="step">
                <h2>Введите код</h2>
                <p class="subtitle">Мы отправили код на <strong id="email-display"></strong>. Код действителен 30 минут.</p>
                <form id="reset-form" class="auth-form">
                    <div class="form-group">
                        <label for="code">Код из письма</label>
                        <input type="text" id="code" name="code" class="code-input" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" required>
                    </div>
                    <div class="form-group">
                        <label for="new_password">Новый пароль</label>
                        <input type="password" id="new_password" name="new_password" minlength="8" required autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="new_password_confirm">Подтвердите пароль</label>
                        <input type="password" id="new_password_confirm" name="new_password_confirm" minlength="8" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn-primary" id="reset-btn">Установить новый пароль</button>
                </form>
                <div class="resend-line">
                    <button type="button" class="btn-link" id="resend-btn">Не получили код? Отправить снова</button>
                </div>
                <div class="auth-footer">
                    <button type="button" class="btn-link" id="back-btn">← Изменить email</button>
                </div>
            </div>

            <!-- Шаг 3: успех -->
            <div id="step-done" class="step">
                <h2>Пароль обновлён</h2>
                <p class="subtitle">Теперь вы можете войти с новым паролем.</p>
                <a href="/login" class="btn-primary" style="display:block;text-align:center;text-decoration:none">Перейти ко входу</a>
            </div>
        </div>
    </div>

    <script>
        const errorDiv = document.getElementById('error-message');
        const successDiv = document.getElementById('success-message');
        let savedEmail = '';

        function showStep(name) {
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById('step-' + name).classList.add('active');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
        }

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
        }

        function showSuccess(msg) {
            successDiv.textContent = msg;
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
        }

        async function requestCode(email) {
            const response = await fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Не удалось отправить код');
            }
            return data;
        }

        // Шаг 1: запрос кода
        document.getElementById('email-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('email-btn');
            const email = document.getElementById('email').value.trim();

            btn.disabled = true;
            btn.textContent = 'Отправка...';
            errorDiv.style.display = 'none';

            try {
                await requestCode(email);
                savedEmail = email;
                document.getElementById('email-display').textContent = email;
                showStep('reset');
            } catch (err) {
                showError(err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Отправить код';
            }
        });

        // Шаг 2: установка нового пароля
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('reset-btn');
            const code = document.getElementById('code').value.trim();
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('new_password_confirm').value;

            if (newPassword !== confirmPassword) {
                showError('Пароли не совпадают');
                return;
            }
            if (newPassword.length < 8) {
                showError('Пароль должен содержать минимум 8 символов');
                return;
            }
            if (!/^\d{6}$/.test(code)) {
                showError('Код должен содержать 6 цифр');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Сохранение...';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: savedEmail,
                        code: code,
                        new_password: newPassword
                    })
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Не удалось сбросить пароль');
                }
                showStep('done');
            } catch (err) {
                showError(err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Установить новый пароль';
            }
        });

        // Повторная отправка кода
        document.getElementById('resend-btn').addEventListener('click', async () => {
            if (!savedEmail) return;
            const btn = document.getElementById('resend-btn');
            btn.disabled = true;
            btn.textContent = 'Отправка...';
            try {
                await requestCode(savedEmail);
                showSuccess('Новый код отправлен на ваш email');
            } catch (err) {
                showError(err.message);
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    btn.textContent = 'Не получили код? Отправить снова';
                }, 30000); // 30 секунд кулдаун
            }
        });

        // Назад к шагу email
        document.getElementById('back-btn').addEventListener('click', () => {
            showStep('email');
        });

        // Только цифры в поле кода
        document.getElementById('code').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
        });
    </script>
</body>
</html>
