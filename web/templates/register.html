<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - ХозДача</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e8f0e3 0%, #d4e8c5 50%, #c8dfb8 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .reg-card {
            background: #fff; border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.10);
            width: 440px; max-width: 94vw; padding: 36px 32px 28px;
            position: relative; overflow: hidden;
        }
        .reg-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 4px; background: linear-gradient(90deg, #4A7C59, #8B6F47);
        }
        .reg-title { font-size: 1.5rem; font-weight: 700; color: #2d3a2c; text-align: center; margin-bottom: 6px; }
        .reg-subtitle { text-align: center; color: #888; font-size: 0.9rem; margin-bottom: 24px; }
        .steps { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 28px; }
        .step-dot {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.95rem; transition: all 0.3s;
            border: 2px solid #ddd; color: #aaa; background: #fff; flex-shrink: 0;
        }
        .step-dot.active { border-color: #4A7C59; background: #4A7C59; color: #fff; }
        .step-dot.done { border-color: #4A7C59; background: #e8f0e3; color: #4A7C59; }
        .step-line { width: 48px; height: 2px; background: #ddd; flex-shrink: 0; transition: background 0.3s; }
        .step-line.done { background: #4A7C59; }
        .step-panel { display: none; }
        .step-panel.active { display: block; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 0.85rem; font-weight: 600; color: #444; margin-bottom: 5px; }
        .field input {
            width: 100%; padding: 11px 14px; border: 1.5px solid #e0e0e0;
            border-radius: 8px; font-size: 0.95rem; color: #333;
            transition: border-color 0.2s; background: #fafafa;
        }
        .field input:focus { outline: none; border-color: #4A7C59; background: #fff; }
        .pw-hints { font-size: 0.78rem; color: #999; margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
        .pw-hints span { display: flex; align-items: center; gap: 4px; }
        .pw-hints .ok { color: #4A7C59; }
        .pw-hints .bad { color: #c0392b; }
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
            background: #4A7C59; color: #fff;
        }
        .btn:hover { background: #3d6a4b; }
        .btn:disabled { background: #b0b0b0; cursor: not-allowed; }
        .btn-outline {
            background: transparent; color: #4A7C59;
            border: 1.5px solid #4A7C59; margin-top: 10px;
        }
        .btn-outline:hover { background: #e8f0e3; }
        .btn-outline:disabled { border-color: #ccc; color: #ccc; background: transparent; }
        .msg { padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 14px; display: none; }
        .msg-error { background: #fdecea; color: #b71c1c; }
        .msg-success { background: #e8f5e9; color: #2e7d32; }
        .code-box { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
        .code-box input {
            width: 44px; height: 52px; text-align: center; font-size: 1.3rem; font-weight: 700;
            border: 1.5px solid #e0e0e0; border-radius: 8px; background: #fafafa;
        }
        .code-box input:focus { outline: none; border-color: #4A7C59; background: #fff; }
        .footer-link { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #888; }
        .footer-link a { color: #4A7C59; text-decoration: none; font-weight: 600; }
        .footer-link a:hover { text-decoration: underline; }
        .back-link { display: inline-flex; align-items: center; gap: 4px; font-size: 0.85rem; color: #888; cursor: pointer; margin-bottom: 12px; background: none; border: none; }
        .back-link:hover { color: #4A7C59; }
    </style>
</head>
<body>
<div class="reg-card">
    <div class="reg-title">Регистрация</div>
    <div class="reg-subtitle">Создайте аккаунт за 2 шага</div>

    <div class="steps">
        <div class="step-dot active" id="dot1">1</div>
        <div class="step-line" id="line"></div>
        <div class="step-dot" id="dot2">2</div>
    </div>

    <div id="msgError" class="msg msg-error"></div>
    <div id="msgSuccess" class="msg msg-success"></div>

    <!-- Шаг 1: заполнение данных -->
    <div class="step-panel active" id="panel1">
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
            <label for="name">Имя</label>
            <input type="text" id="name" placeholder="Иван Петров" maxlength="32" autocomplete="name">
        </div>
        <div class="field">
            <label for="phone">Телефон</label>
            <input type="tel" id="phone" placeholder="+7 999 123-45-67" autocomplete="tel">
        </div>
        <div class="field">
            <label for="password">Пароль</label>
            <input type="password" id="password" placeholder="Не менее 8 знаков" autocomplete="new-password">
            <div class="pw-hints">
                <span id="hintLen" class="bad">◌ 8+ символов</span>
                <span id="hintUpper" class="bad">◌ заглавная буква</span>
            </div>
        </div>
        <!-- honeypot -->
        <div style="position:absolute;left:-9999px" aria-hidden="true">
            <input type="text" id="website" autocomplete="off" tabindex="-1">
        </div>
        <button class="btn" id="btnStep1">Продолжить</button>
    </div>

    <!-- Шаг 2: код подтверждения -->
    <div class="step-panel" id="panel2">
        <button class="back-link" id="btnBack">← Назад</button>
        <p style="text-align:center;color:#555;font-size:0.9rem;margin-bottom:16px">
            Мы отправили код из 6 цифр на <strong id="emailDisplay"></strong>
        </p>
        <div class="code-box" id="codeBox">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="0">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="1">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="2">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="3">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="4">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="5">
        </div>
        <button class="btn" id="btnStep2">Подтвердить</button>
        <button class="btn btn-outline" id="btnResend">Отправить код ещё раз</button>
    </div>

    <div class="footer-link">
        Уже есть аккаунт? <a href="/login">Войти</a>
    </div>
</div>

    <script>
        let pendingEmail = null;
        let formStartTime = null;

        // --- Password hints ---
        const pw = document.getElementById('password');
        const hintLen = document.getElementById('hintLen');
        const hintUpper = document.getElementById('hintUpper');
        pw.addEventListener('input', function() {
            const v = pw.value;
            hintLen.className = v.length >= 8 ? 'ok' : 'bad';
            hintLen.textContent = (v.length >= 8 ? '●' : '◌') + ' 8+ символов';
            hintUpper.className = /[A-ZА-ЯЁ]/.test(v) ? 'ok' : 'bad';
            hintUpper.textContent = (/[A-ZА-ЯЁ]/.test(v) ? '●' : '◌') + ' заглавная буква';
        });

        // --- Timer ---
        ['email','password'].forEach(function(id) {
            document.getElementById(id).addEventListener('focus', function() {
                if (!formStartTime) formStartTime = Date.now();
            });
        });

        // --- Show message ---
        function showMsg(type, text) {
            var el = document.getElementById(type === 'error' ? 'msgError' : 'msgSuccess');
            el.textContent = text; el.style.display = 'block';
        }
        function hideMsgs() {
            document.getElementById('msgError').style.display = 'none';
            document.getElementById('msgSuccess').style.display = 'none';
        }

        // --- Switch panels ---
        function goStep(n) {
            var p1 = document.getElementById('panel1'), p2 = document.getElementById('panel2');
            var d1 = document.getElementById('dot1'), d2 = document.getElementById('dot2');
            var line = document.getElementById('line');
            if (n === 1) {
                p1.classList.add('active'); p2.classList.remove('active');
                d1.className = 'step-dot active'; d2.className = 'step-dot';
                line.classList.remove('done');
            } else {
                p1.classList.remove('active'); p2.classList.add('active');
                d1.className = 'step-dot done'; d2.className = 'step-dot active';
                line.classList.add('done');
            }
        }

        // --- Step 1: submit registration ---
        document.getElementById('btnStep1').addEventListener('click', async function() {
            var btn = this;
            hideMsgs();

            // honeypot
            if (document.getElementById('website').value.trim() !== '') {
                showMsg('error', 'Обнаружен бот. Попробуйте ещё раз.');
                return;
            }
            // speed check
            if (!formStartTime) formStartTime = Date.now();
            if (Date.now() - formStartTime < 1000) {
                showMsg('error', 'Не торопитесь. Это защита от ботов.');
                return;
            }

            var email = document.getElementById('email').value.trim();
            var name = document.getElementById('name').value.trim();
            var phone = document.getElementById('phone').value.trim();
            var password = pw.value;

            if (!email || !name || !phone || !password) {
                showMsg('error', 'Заполните все поля');
                return;
            }
            if (password.length < 8) {
                showMsg('error', 'Пароль должен быть не короче 8 знаков');
                return;
            }
            if (!/[A-ZА-ЯЁ]/.test(password)) {
                showMsg('error', 'Нужна хотя бы одна заглавная буква');
                return;
            }

            btn.disabled = true; btn.textContent = 'Отправка...';

            try {
                var r = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: email, name: name, phone: phone, password: password})
                });
                var d = await r.json();

                if (r.ok || r.status === 202) {
                    pendingEmail = email;
                    document.getElementById('emailDisplay').textContent = email;
                    goStep(2);
                    document.querySelectorAll('#codeBox input').forEach(function(inp) { inp.value = ''; });
                    document.getElementById('codeBox').querySelector('input').focus();
                    showMsg('success', d.message || 'Код отправлен на вашу почту!');
                    pw.value = '';
                    hintLen.className = 'bad'; hintLen.textContent = '◌ 8+ символов';
                    hintUpper.className = 'bad'; hintUpper.textContent = '◌ заглавная буква';
                } else {
                    showMsg('error', d.error || 'Ошибка при регистрации');
                    if (d.retry_after) {
                        btn.disabled = true;
                        setTimeout(function() { btn.disabled = false; btn.textContent = 'Продолжить'; }, d.retry_after * 1000);
                        return;
                    }
                }
            } catch(e) {
                showMsg('error', 'Нет связи. Попробуйте ещё раз.');
            } finally {
                btn.disabled = false; btn.textContent = 'Продолжить';
            }
        });

        // --- Code inputs: auto-focus ---
        var codeInputs = document.querySelectorAll('#codeBox input');
        codeInputs.forEach(function(inp, i) {
            inp.addEventListener('input', function() {
                if (this.value && i < 5) codeInputs[i+1].focus();
            });
            inp.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value && i > 0) codeInputs[i-1].focus();
            });
            inp.addEventListener('paste', function(e) {
                e.preventDefault();
                var paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
                paste.split('').forEach(function(ch, j) { if (codeInputs[j]) codeInputs[j].value = ch; });
                var next = Math.min(paste.length, 5);
                if (codeInputs[next]) codeInputs[next].focus();
            });
        });

        // --- Step 2: verify ---
        document.getElementById('btnStep2').addEventListener('click', async function() {
            var btn = this;
            hideMsgs();
            var code = '';
            codeInputs.forEach(function(inp) { code += inp.value; });
            if (code.length !== 6) {
                showMsg('error', 'Введите код из 6 цифр');
                return;
            }
            btn.disabled = true; btn.textContent = 'Проверка...';
            try {
                var r = await fetch('/api/auth/verify-email', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: pendingEmail, code: code})
                });
                var d = await r.json();
                if (r.ok) {
                    showMsg('success', 'Почта подтверждена! Сейчас переадресуем на вход...');
                    setTimeout(function() {
                        var p = new URLSearchParams(window.location.search);
                        var redir = p.get('redirect');
                        window.location.href = redir ? '/login?redirect=' + redir : '/login';
                    }, 2000);
                } else {
                    showMsg('error', d.error || 'Неверный код');
                }
            } catch(e) {
                showMsg('error', 'Нет связи');
            } finally {
                btn.disabled = false; btn.textContent = 'Подтвердить';
            }
        });

        // --- Resend ---
        document.getElementById('btnResend').addEventListener('click', async function() {
            var btn = this;
            hideMsgs();
            btn.disabled = true; btn.textContent = 'Отправка...';
            try {
                var r = await fetch('/api/auth/send-verification', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: pendingEmail})
                });
                var d = await r.json();
                if (r.ok) {
                    showMsg('success', 'Код отправлен ещё раз!');
                } else {
                    showMsg('error', d.error || 'Ошибка');
                }
            } catch(e) {
                showMsg('error', 'Нет связи');
            } finally {
                btn.disabled = false; btn.textContent = 'Отправить код ещё раз';
            }
        });

        // --- Back ---
        document.getElementById('btnBack').addEventListener('click', function() {
            goStep(1);
            hideMsgs();
        });
    </script>
</body>
</html>
