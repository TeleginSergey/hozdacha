<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — ХозДача</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div data-header-slot></div>

    <main class="container">
        <div class="auth-page">
            <div class="auth-card">
                <h2>Регистрация</h2>
                <form id="registerForm">
                    <input name="name" type="text" placeholder="Имя" required>
                    <input name="email" type="email" placeholder="Email" required autocomplete="email">
                    <input name="phone" type="tel" placeholder="Телефон (+79001234567)" required>
                    <input name="username" type="text" placeholder="Логин (необязательно)" autocomplete="username">
                    <input name="password" type="password" placeholder="Пароль (мин. 8 символов)" required minlength="8" autocomplete="new-password">
                    <input name="website" type="text" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
                    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                </form>
                <div class="form-footer">
                    Уже есть аккаунт? <a href="/login">Войти</a>
                </div>
            </div>
        </div>
    </main>

    <div data-footer-slot></div>

    <script src="/static/js/app.js"></script>
    <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const btn = e.target.querySelector('button');
        btn.disabled = true; btn.textContent = 'Регистрация...';
        try {
            const body = {
                name: fd.get('name'),
                email: fd.get('email'),
                phone: fd.get('phone'),
                password: fd.get('password'),
                website: fd.get('website') || ''
            };
            const username = (fd.get('username') || '').trim();
            if (username) body.username = username;
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Ошибка регистрации');
            App.toast('Регистрация успешна! Войдите.', 'success');
            setTimeout(() => { window.location.href = '/login'; }, 1000);
        } catch (err) {
            App.toast(err.message, 'error');
        } finally {
            btn.disabled = false; btn.textContent = 'Зарегистрироваться';
        }
    });
    </script>
</body>
</html>
