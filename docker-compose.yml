services:
  hozdacha_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hozdacha_network

  redis:
    image: redis:7-alpine
    container_name: hozdacha_redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hozdacha_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hozdacha_app
    env_file:
      - .env
    depends_on:
      hozdacha_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./web:/root/web
      - product_images:/root/web/static/images/products
    restart: unless-stopped
    networks:
      - hozdacha_network
    # На хосте 4 CPU: можно ограничить приложение (Swarm / часть оркестраторов):
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "3.0"
    # Параллельные воркеры синхронизации МойСклад (не равно числу CPU; см. MOYSKLAD_SYNC_WORKERS в .env).

  # Разовые миграции: docker compose run --rm migrate
  # (не подменяйте команду основного сервиса на migrate-up — контейнер завершится).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      hozdacha_db:
        condition: service_healthy
    command: ["migrate-up"]
    networks:
      - hozdacha_network
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  product_images:

networks:
  hozdacha_network:
    driver: bridge

